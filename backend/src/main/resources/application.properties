# Server
server.port=8080

# PostgreSQL (override via environment variables if needed)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/employee_tmd}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Seed data — set to 'always' once data.sql is populated
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# JSON date format (ISO-8601 for frontend)
spring.jackson.serialization.write-dates-as-timestamps=false
