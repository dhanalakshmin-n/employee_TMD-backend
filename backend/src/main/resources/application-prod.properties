# Production (Render) — set DATABASE_URL, DB_USERNAME, DB_PASSWORD as env vars
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Keep pool small on Supabase session pooler (max 15 connections)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# CORS — override on Render if using a custom domain: CORS_ALLOWED_ORIGIN_PATTERNS
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,https://*.vercel.app}
